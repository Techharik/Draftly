services:
  redis:
    image: redis:7
    container_name: draftly-redis

    ports:
      - "6379:6379"

  postgres:
    image: postgres:16

    container_name: draftly-postgres

    environment:
      POSTGRES_USER: draftly
      POSTGRES_PASSWORD: draftly
      POSTGRES_DB: draftly

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
